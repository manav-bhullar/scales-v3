[project]
name = "scales"
version = "3.0.0"
description = "SCALES v3.0 — Structured Concept-Anchored LLM Evaluation System (FYP prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests that call real external services",
    "contracts: eval dataset integrity gates (roadmap Step 0 / Phase B)",
    "harness: CLI/tooling the roadmap depends on (Steps 2 and 4)",
    "regression: pinned behaviour on frozen run artifacts (Step 6)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
