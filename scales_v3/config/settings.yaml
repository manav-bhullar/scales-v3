# SCALES v3.0 application configuration
# Sensitive API keys live in .env — never commit them.

# ─── LLM Configuration ───
# Wave 4+: Gemini 3.1 Flash-Lite has free API quota and structured output.
# Four team keys rotate on 429. Keep one model fixed per research run.
llm:
  cera_model: "gemini/gemini-3.1-flash-lite"
  cgr_model: "gemini/gemini-3.1-flash-lite"
  stability_model: "gemini/gemini-3.1-flash-lite"
  temperature: 0.1
  max_retries: 5
  retry_delay_seconds: 5
  max_concurrent_calls: 1

# ─── NLI Configuration ───
nli:
  model_name: "cross-encoder/nli-deberta-v3-base"
  device: "cpu"          # use "cuda" if a GPU is available
  batch_size: 32

# ─── CBTE Configuration (skeleton: Tier 1 + Tier 2; Tier 3 placeholder) ───
cbte:
  tier1_keyword_threshold: 0.3
  tier2_nli_threshold: 0.7
  tier3_weights:
    nli: 0.4
    stability: 0.3
    keyword: 0.3
  tau: 0.5
  tau_source: "manual"   # "manual" for FYP skeleton; "conformal" is future work
  enable_tier3: false    # Tier 3 synonym stability deferred

# ─── Conformal Risk Control (future work — documented but not required) ───
conformal:
  alpha: 0.10
  calibration_data_path: "data/calibration/"
  auto_adjust: true

# ─── Partial Credit ───
grading:
  allowed_marks_fractions: [0.0, 0.5, 1.0]

# ─── Paths (relative to scales_v3/) ───
paths:
  database: "data/scales.db"   # unused in JSON-persistence skeleton; reserved
  data_dir: "data/"
  exams_dir: "data/exams/"
  prompts_dir: "config/prompts/"
  logs_dir: "logs/"

# ─── Logging ───
logging:
  level: "INFO"
  log_llm_responses: true
  log_nli_scores: true
